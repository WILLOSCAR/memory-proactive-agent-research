  owner: agent:auto-research
  started_at: 2026-08-06T14:00:00+08:00
  ended_at: 2026-08-06T14:00:10+08:00

design:
  hypothesis: >
    The E-C03-01 cross-layer revocation residue (source-tag purge insufficient;
    residue in summary/cache) reproduces in a REAL dense-vector RAG memory where
    retrieval is cosine k-NN over embeddings, not exact-string matching.
  independent_variable: repair_strategy {no_purge, source_tag_purge, cross_layer_repair} + channel ablation {cache, summary}
  held_constants: [episodes=300, topics=12, seed=20260806, embed_dim=256]
  primary_metric: residual_influence (revoked value still surfaces) + benign_retention
  baselines: [source_tag_purge (killer baseline), no_purge (floor)]
  stop_rule: >
    CONTINUE if source_tag_purge residual > 5% AND cross_layer_repair <= 2%;
    WEAKEN if source_tag_purge <= 2% (residue does not survive semantic retrieval).
  resource_ceiling: CPU only, < 1 min

reproducibility:
  repo: memory-proactive-agent-research
  commit_sha: fa6b836eb8a82ed74be778ec288541ba3a254031
  dirty_diff_digest: experiments-untracked-at-run
  environment: python 3.14.3 + numpy 2.5.0 (no network)
  entrypoint: python3 experiments/E-C03-02/rag_canary.py --episodes 300 --topics 12 --seed 20260806
  prompt_version: not_applicable
  model: "none — retrieval is real cosine k-NN over hashed-n-gram dense vectors; LLM-summary layer is a vector-mean stub (no deployed endpoint)"
  parameters: {episodes: 300, topics: 12, seed: 20260806, embed_dim: 256}
  seed: 20260806
  code_digest: sha256:eb3e7dee2f85dd93cbe77019a772e4f8532712cc9d38170d8c77f636fe5a2f06

