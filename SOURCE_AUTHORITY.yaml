    authority: current_state
    governs: [mentor_daily_automation_id, mentor_target_thread, mentor_daily_cadence, mentor_notification_policy]
    note: This is a readback of scheduler bindings. It does not prove a daily check completed; completion must be read from Track Mentor files and scheduler run state.

