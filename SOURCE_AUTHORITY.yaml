schema_version: 1
updated_at: 2026-09-08
purpose: >-
  Resolve precedence when local files or ChatGPT Project Sources use different
  generations of the Auto Research ontology. Lower-authority sources remain
  available for audit but must not override canonical sources.

precedence:
  - canonical
  - current_state
  - verified_evidence
  - adopted_decision
  - supporting_context
  - frozen_legacy
  - user_managed_reference

topic_owners:
  repository_navigation: README.md
  end_to_end_workflow_guide: docs/WORKFLOW.md
  human_launch: START_HERE.md
  vocabulary: CONTEXT.md
  macro_architecture: system/architecture/FRAMEWORK.md
  collaboration_workflow: AUTO_RESEARCH_SOP.md
  scientific_workflow: OPERATIONS.md
  executable_settlement_event_contract: templates/research-event.json
  experiment_run_archive_contract: experiments/EXPERIMENT_REPORTING_STANDARD.md
  implementation_maturity: system/architecture/IMPLEMENTATION_STATUS.yaml
  coordination_binding: system/coordination/registry.yaml
  mentor_student_review_queue: tracks/<track-id>/mentor/REVIEW_QUEUE.yaml
  mentor_daily_observation: tracks/<track-id>/mentor/daily/<YYYY-MM>.md
  student_mentor_dossier: tracks/<track-id>/students/<student-id>/MENTOR_DOSSIER.md
  mentor_review_delivery: system/coordination/delivery-ledger.jsonl
  mentor_daily_automation_binding: system/coordination/mentor-automations.yaml
  student_runtime_observation: system/coordination/runtime-bindings.yaml
  track_mentor_goal_behavior: templates/track-mentor-goal.md
  track_mentor_workspace_contract: templates/mentor-workspace.yaml
  track_mentor_cycle_contract: templates/mentor-cycle.md
  student_goal_behavior: templates/student-goal.md
  execution_controller_goal_behavior: templates/execution-controller-goal.md
  student_goal_incident_learning: system/coordination/student-goal-incidents.jsonl
  student_gpu_lab_policy: AUTO_RESEARCH_SOP.md
  student_container_runtime_binding: system/scheduling/student-labs.yaml
  student_storage_profiles: system/scheduling/storage-profiles.json
  reusable_storage_asset_receipt: templates/storage-asset-receipt.json
  reusable_asset_load_receipt: templates/asset-load-receipt.json
  gpu_quick_deploy_spec: templates/gpu-quick-deploy-spec.json
  external_service_resolution_receipt: templates/external-service-receipt.json
  legacy_asset_migration: system/migration/FINAL_RECEIPT.json

sources:
  README.md:
    authority: supporting_context
    governs: [repository_navigation, workflow_overview]
    note: GitHub entry point; links to authoritative contracts and never freezes live role, resource, or research counts.

  docs/WORKFLOW.md:
    authority: supporting_context
    governs: [end_to_end_workflow_guide, documentation_and_deployment_boundary]
    note: Connects existing contracts for readers. AUTO_RESEARCH_SOP.md, OPERATIONS.md, and the reporting standard retain authority; deployment paths require actual runtime verification.

  START_HERE.md:
    authority: canonical
    governs: [human_goal_launch, current_student_goal_index, file_first_runtime_entry]
    note: This is the only human launch index. It does not store live research or Chat state.

  CONTEXT.md:
    authority: canonical
    governs: [vocabulary, entity_boundaries, evidence_terms]

  REQUIREMENTS_AUTO_RESEARCH_OS.md:
    authority: canonical
    governs: [product_goal, domain_model, interface_contract, acceptance]

  AUTO_RESEARCH_SOP.md:
    authority: canonical
    governs: [orchestrator_authority, agent_topology, chat_binding, student_wip, daily_mentor_supervision, execution_controller_role, optional_engineer_escalation, peer_diagnostic, pro_teacher_boundary, user_agent_interaction, handoff_contract]

  system/architecture/FRAMEWORK.md:
    authority: canonical
    governs: [macro_authority_tree, module_boundaries, student_research_line_granularity, execution_controller_topology, external_pro_scopes, execution_control_plane, concurrency_boundary]

  system/architecture/IMPLEMENTATION_STATUS.yaml:
    authority: current_state
    governs: [system_module_implementation_maturity]
    note: Built, partial, and planned apply to system implementation only; this file does not override research, Chat runtime, or live resource state.

  system/coordination/README.md:
    authority: canonical
    governs: [coordination_registry_contract, mentor_action_recovery, student_cycle_recovery, mentor_daily_review_queue, dossier_snapshot_contract, mentor_review_delivery, student_review_ack, runtime_binding_observation, claude_tmux_transport_boundary, communication_packet_contract, delivery_ack_contract, cross_track_writer_rule]
    note: The contract is canonical. Review delivery is implemented for the Mentor-Student path; the generic Communication Packet delivery adapter remains incomplete.

  system/coordination/registry.yaml:
    authority: current_state
    governs: [role_addressing, track_binding, student_mission_binding, student_research_line_lineage, execution_controller_binding, codex_task_binding, automation_binding, scoped_pro_lineage, writer_scope]
    note: create-ready is file readiness only. Registry active means an observed task ID, while scientific execution is determined by the Student live Cycle. This registry never stores Research Judgment.

  system/coordination/runtime-bindings.yaml:
    authority: current_state
    governs: [student_tmux_profile, observed_claude_session, observed_cycle_pointer, controller_freeze_observation, effective_runtime_connection]
    note: This is a timestamped operational observation. Connected or frozen does not prove useful workload, GPU allocation, scientific progress, or a Codex task binding.

