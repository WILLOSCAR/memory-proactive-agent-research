    governs: [student_stage_synthesis, mentor_facing_research_question, mentor_facing_next_evidence]
    note: Student-owned synthesis only. Underlying Cycle, Run, report, log and evidence pointers remain authoritative; each queued digest is snapshotted immutably.

  system/coordination/delivery-ledger.jsonl:
    authority: current_state
    governs: [mentor_review_sent_receipt, student_review_ack_receipt]
    note: A receipt proves delivery or acknowledgement only. Applied guidance is not canonical Settlement or scientific Evidence.

