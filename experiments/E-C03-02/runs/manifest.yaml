result_summary:
  source_tag_purge_residual: 1.00
  cross_layer_repair_residual: 0.00
  no_purge_residual: 1.00
  benign_retention_all: 1.00
  channel_summary_only: 0.16   # summary is the origination leak
  channel_cache_only: 0.00     # cache alone originates nothing
  base_only_both_denied: 0.00  # base store purges cleanly (verified)
  reading: >
    CONTINUE-signal on real semantic retrieval. New nuance vs E-C03-01: the
    summary is the ORIGINATION channel (16% residual on its own — semantic
    retrieval sometimes still prefers the live base value), while the cache is a
    PROPAGATION amplifier (0% on its own, but serves a stale-summary-derived
    answer verbatim, driving the combined residual to 100%). Cross-layer repair
    clears both; base-only purges cleanly.

evidence_boundary: >
  Real dense-vector retrieval (cosine k-NN over a genuine hashed-n-gram
  vector-space model), deterministic + seeded + reproducible (identical digests
  across runs). Strengthens E-C03-01 from exact-string identity to semantic
  retrieval, and adds origination-vs-propagation channel attribution. Still NOT a
  live LLM summary (account forbids model-ID calls; no endpoint deployed — a
  high-impact action deferred to the user) and NOT real user data. The full
  publishable claim awaits a real LLM-summary run; this establishes the residue
  mechanism survives semantic retrieval and localizes its origination to the
  summary layer.
