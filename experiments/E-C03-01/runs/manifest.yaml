evidence_boundary: >
  Deterministic simulation of a 4-layer memory mechanism; NOT an LLM run and NOT
  real user data. Establishes the benign-revocation residue is mechanistically
  real, per-layer localizable (summary+cache), and removable by cross-layer
  repair. Does NOT quantify prevalence in any deployed system or real LLM memory
  stack. This is a Local Result at the "mechanism exists + is measurable" level,
  not an empirical claim about production systems.
