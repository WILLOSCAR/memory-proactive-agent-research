    (() =&gt; {

      if (!root) return;
      const tabs = [...root.querySelectorAll('.rif-tab')];
      const branches = [...root.querySelectorAll('.rif-branch')];
      const search = root.querySelector('.rif-search');
      const activate = (id) =&gt; {
        tabs.forEach(t =&gt; t.setAttribute('aria-selected', String(t.dataset.target === id)));
        branches.forEach(b =&gt; b.classList.toggle('is-active', b.id === id));
        filter();
      };
      const filter = () =&gt; {
        const q = (search.value || '').trim().toLowerCase();
        const active = root.querySelector('.rif-branch.is-active');
        if (!active) return;
        active.querySelectorAll('details').forEach(node =&gt; {
          const hay = `${node.dataset.search || ''} ${node.textContent}`.toLowerCase();
          const match = !q || hay.includes(q);
          node.classList.toggle('rif-hidden', !match);
          if (q &amp;&amp; match) node.open = true;
        });
      };
      tabs.forEach(tab =&gt; tab.addEventListener('click', () =&gt; activate(tab.dataset.target)));
      search.addEventListener('input', filter);
      search.addEventListener('keydown', e =&gt; { if (e.key === 'Escape') { search.value = ''; filter(); search.blur(); } });
    })();
