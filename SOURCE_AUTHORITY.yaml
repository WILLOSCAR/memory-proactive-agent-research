    governs: [student_runtime_incident_history, generalized_prevention_rule, prompt_delta_validation]
    note: The registered Execution Controller Agent is the sole writer for its declared scope. This durable operational ledger records confirmed prevention decisions; it is not scientific Evidence and does not override Student, Run, Handoff, or Settlement state.

  system/migration/asset-ledger.jsonl:
    authority: current_state
    governs: [legacy_asset_inventory, migration_class, proposed_target_owner, migration_action]
