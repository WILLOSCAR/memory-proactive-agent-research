rules:
  - Canonical vocabulary wins over frozen legacy terminology.
  - Root canonical files are a stable public interface; new modules are additive and must not duplicate or silently relocate those authorities.
  - A planned path or role is not a live instance; implementation maturity comes from system/architecture/IMPLEMENTATION_STATUS.yaml and runtime state still requires a fresh observation.
  - AUTO_RESEARCH_SOP.md governs roles, Chat binding, WIP, user intent, and Handoff; OPERATIONS.md governs research evidence and execution semantics; the experiment reporting standard governs Run package closure and archival proof.
  - Track and Student GOAL files are human launch interfaces and bindings, not dynamic state. Mentor Actions write through the bound Track Mentor Workspace and one Mentor Cycle; daily supervision uses the separate Track mentor directory and declared communication adapter. Student research writes through its bound workspace and owned Experiment paths.
  - Execution Controller state is valid only through an explicit registry binding and its declared writer scope. Each Track has at most one active Controller coverage; a shared Controller must name every Mentor and Student, keep scopes disjoint, and emit Track-scoped deltas. Engineer work is ephemeral, incident-scoped, and cannot become a second runtime writer.
  - Moving or indexing a legacy asset never promotes its scientific status. A Bootstrap Import is not a Student Cycle, Handoff, Evidence, Judgment Delta, Mentor verdict, or Settlement; promotion still requires the original evidence gates and reviewed Settlement.
  - Current-state files may change research state but may not redefine entities.
  - Every Claim-bearing Run executes inside a verified remote Student Lab or Job container. Local commands are control-plane smoke only and cannot become Evidence or support Stage Settlement.
  - Verified evidence supports only its recorded scope.
  - External review never becomes evidence and changes state only through a local verdict.
  - Dashboard and Leader Brief must derive from canonical/current-state assets, not chat transcripts.
  - Structured counts and state come from research-index.yaml; CURRENT.md is a readable projection.
  - Candidate current-next evidence has one canonical field; Proposal, Reasoning, and Leader narratives may only reference it.
  - A Research Event records change history but does not become evidence unless it contains a valid typed evidence pointer.
  - Research Question and declarative Claim are distinct; a question cannot be indexed as a Claim.
  - Review Route is proposed pressure until an explicit Decision is applied; it cannot silently mutate Candidate lineage.
  - Source, Candidate, document, page, and Run counts are inventory/activity; material Judgment Delta is the primary progress unit.
