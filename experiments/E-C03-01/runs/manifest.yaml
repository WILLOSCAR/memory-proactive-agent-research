  ended_at: 2026-08-06T12:00:05+08:00

design:
  hypothesis: >
    After a benign user revocation, influence residues across derived memory
    layers (summary/cache/adapter) and a source-tag base purge is insufficient
    to remove it; cross-layer repair is required.
  independent_variable: repair_strategy {no_purge, source_tag_purge, cross_layer_repair}
  held_constants: [episodes=400, topics=12, seed=20260806, layer_model=4-layer]
  primary_metric: residual_influence (+ benign_retention guard)
  baselines: [source_tag_purge (killer baseline), no_purge (floor)]
  stop_rule: >
    CONTINUE if source_tag_purge residual > 5% AND cross_layer_repair <= 1% AND
    base_only purges cleanly; KILL (engineering note) if source_tag_purge <= 1%.
  resource_ceiling: CPU only, < 1 min

reproducibility:
  repo: memory-proactive-agent-research
  commit_sha: 4ebe13d2e3193bbd166d098ea7fa5fe5a9edfea5
  dirty_diff_digest: experiments-untracked-at-run   # experiment files new this run
  environment: python 3.14.3 (stdlib only; no external deps, no network)
  entrypoint: python3 experiments/E-C03-01/canary.py --episodes 400 --topics 12 --seed 20260806
  prompt_version: not_applicable   # deterministic simulation, no LLM
  model: none (deterministic mechanism simulation)
  parameters: {episodes: 400, topics: 12, seed: 20260806}
  seed: 20260806
